<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="College Management System — Results, Grades, SPI & CGPA">
<title>Results & Grades — College Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="glass-theme.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
  body { display: flex; }

  /* CGPA hero banner */
  .cgpa-hero {
    background: linear-gradient(135deg, rgba(255,154,60,0.12) 0%, rgba(255,95,109,0.08) 100%);
    border: 1px solid rgba(255,154,60,0.25);
    border-radius: 28px;
    padding: 28px 32px;
    display: flex;
    align-items: center;
    gap: 28px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }
  .cgpa-circle {
    width: 110px; height: 110px; border-radius: 50%;
    background: var(--accent);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 8px 32px var(--accent-glow);
  }
  .cgpa-val   { font-size: 30px; font-weight: 700; color: #fff; line-height: 1; }
  .cgpa-sub   { font-size: 10px; color: rgba(255,255,255,0.75); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
  .cgpa-info  { flex: 1; }
  .cgpa-name  { font-size: 22px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
  .cgpa-chips { display: flex; flex-wrap: wrap; gap: 8px; }

  /* SPI row of stat cards */
  .spi-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 24px; }
  .spi-scroll::-webkit-scrollbar { height: 3px; }
  .spi-card {
    flex-shrink: 0;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 16px 20px;
    min-width: 130px;
    cursor: pointer;
    transition: 0.2s;
  }
  .spi-card:hover { background: rgba(255,255,255,0.09); transform: translateY(-2px); }
  .spi-card.active {
    background: rgba(255,154,60,0.12);
    border-color: rgba(255,154,60,0.4);
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .spi-sem   { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px; }
  .spi-val   { font-size: 22px; font-weight: 700; color: var(--text-primary); }
  .spi-badge { margin-top: 6px; }

  /* Semester accordion */
  .sem-block { margin-bottom: 16px; }
  .sem-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    background: rgba(255,154,60,0.07);
    border: 1px solid rgba(255,154,60,0.2);
    border-radius: 16px 16px 0 0;
    cursor: pointer; transition: 0.2s;
  }
  .sem-header.collapsed { border-radius: 16px; }
  .sem-header:hover { background: rgba(255,154,60,0.13); }
  .sem-htitle { font-size: 15px; font-weight: 700; color: var(--accent-start); }
  .sem-hright { display: flex; gap: 12px; align-items: center; }
  .sem-spi    { font-size: 16px; font-weight: 700; color: var(--teal); }
  .sem-body   { border: 1px solid rgba(255,154,60,0.15); border-top: none; border-radius: 0 0 16px 16px; overflow: hidden; display: none; }
  .sem-body.open { display: block; }
  .chevron { color: var(--text-muted); transition: transform 0.25s; font-size: 12px; }
  .chevron.open { transform: rotate(180deg); }
</style>
</head>
<body>

<!-- ═══ SIDEBAR ═══ -->
<aside class="glass-sidebar">
  <div class="sb-brand">🎓</div>
  <nav class="sb-nav" id="sbNavItems"></nav>
  <div class="sb-bottom">
    <div class="sb-avatar" id="sbAvatar">U</div>
    <button class="sb-logout" onclick="logout()" title="Logout">🚪</button>
  </div>
</aside>

<!-- ═══ MAIN ═══ -->
<main class="glass-main">
  <div class="glass-topbar">
    <div>
      <div class="page-heading">Results & Grades 🏆</div>
      <div class="page-sub">Subject-wise grades, SPI per semester and overall CGPA</div>
    </div>
  </div>

  <div id="alertBox" class="glass-alert"></div>

  <!-- Admin/Staff: Student picker -->
  <div id="pickerPanel" class="glass-card card-p-md" style="display:none;margin-bottom:24px;">
    <div class="section-title" style="margin-bottom:16px;">🔍 Select Student</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
      <div style="flex:1;min-width:220px;">
        <label class="glass-label">Student</label>
        <div class="glass-select-wrap">
          <select id="studentDropdown" class="glass-select">
            <option value="">— Loading... —</option>
          </select>
        </div>
      </div>
      <button class="glass-btn-primary" onclick="loadResult()">Load Results →</button>
    </div>
  </div>

  <!-- Spinner -->
  <div id="spinner" style="display:none;">
    <div class="glass-spinner"><div class="spinner-ring"></div><span>Loading results...</span></div>
  </div>

  <!-- Result area -->
  <div id="resultArea" style="display:none;">
    <!-- CGPA hero -->
    <div class="cgpa-hero" id="cgpaBanner"></div>

    <!-- SPI chip row -->
    <div class="spi-scroll" id="spiRow"></div>

    <!-- Subject breakdown -->
    <div class="glass-card card-p-md">
      <div class="section-title">📋 Semester-wise Breakdown <span style="margin-left:auto;font-size:12px;color:var(--text-subtle);">(click semester to expand)</span></div>
      <div id="semContainer"></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="glass-theme.js"></script>
<script>
requireAuth(['Admin','Staff','Faculty','Student']);

const role     = getRole();
const userName = getUser();

// Build sidebar
function buildSidebar() {
  let nav = '';
  if (role === 'Admin') {
    nav = `
      <a class="sb-item" href="admin.html"         data-tip="Dashboard">📊</a>
      <a class="sb-item" href="users.html"          data-tip="Users">👥</a>
      <div class="sb-sep"></div>
      <a class="sb-item" href="departments.html"    data-tip="Departments">🏛️</a>
      <a class="sb-item" href="courses.html"        data-tip="Courses">📚</a>
      <a class="sb-item" href="students.html"       data-tip="Students">🎓</a>
      <a class="sb-item" href="Exam.html"           data-tip="Exams">📝</a>
      <a class="sb-item" href="StudyMaterial.html"  data-tip="Study Material">📖</a>
      <a class="sb-item" href="Fees.html"           data-tip="Fees">💰</a>
      <a class="sb-item active" href="results.html" data-tip="Results">🏆</a>
      <a class="sb-item" href="hostel.html"         data-tip="Hostel">🏠</a>
      <a class="sb-item" href="recheck.html"        data-tip="Re-check">🔁</a>
      <a class="sb-item" href="placement.html"      data-tip="Placement">💼</a>
      <a class="sb-item" href="timetable.html"      data-tip="Timetable">🗓️</a>
      <a class="sb-item" href="report.html"         data-tip="Reports">📈</a>`;
  } else if (role === 'Faculty' || role === 'Staff') {
    nav = `
      <a class="sb-item" href="Faculty.html"         data-tip="Dashboard">🏠</a>
      <a class="sb-item active" href="results.html"  data-tip="Results">🏆</a>
      <a class="sb-item" href="recheck.html"         data-tip="Re-check">🔁</a>
      <a class="sb-item" href="report.html"          data-tip="Reports">📈</a>`;
  } else {
    nav = `
      <a class="sb-item" href="student.html"         data-tip="Dashboard">🏠</a>
      <a class="sb-item" href="Exam-Portal.html"     data-tip="Exam Portal">🧪</a>
      <a class="sb-item active" href="results.html"  data-tip="Results">🏆</a>
      <a class="sb-item" href="recheck.html"         data-tip="Re-check">🔁</a>
      <a class="sb-item" href="hostel.html"          data-tip="Hostel">🏠</a>
      <a class="sb-item" href="placement.html"       data-tip="Placement">💼</a>
      <a class="sb-item" href="timetable.html"       data-tip="Timetable">🗓️</a>`;
  }
  $('#sbNavItems').html(nav);
}

function showAlert(msg, type) {
  $('#alertBox').attr('class', 'glass-alert glass-alert-' + type + ' show').html(msg);
  setTimeout(() => $('#alertBox').removeClass('show'), 5000);
}

// Grade class helper
function gradeClass(g) {
  if (['A+','A'].includes(g))    return 'grade-a';
  if (['B+','B'].includes(g))    return 'grade-b';
  if (['C+','C'].includes(g))    return 'grade-c';
  return 'grade-f';
}

// ── INIT ──
buildSidebar();

if (role === 'Student') {
  $('#spinner').show();
  $.ajax({
    url: API_BASE + '/Result/my', headers: authHeader(),
    success: d => { $('#spinner').hide(); renderResult(d, userName); },
    error:   x => { $('#spinner').hide(); showAlert(x.responseJSON?.message || 'Results load nahi thaya.', 'error'); }
  });
} else {
  $('#pickerPanel').show();
  $.ajax({
    url: API_BASE + '/Admin/student-profiles', headers: authHeader(),
    success: d => {
      let opts = `<option value="">— Select student —</option>`;
      (d||[]).forEach(s => { opts += `<option value="${s.studentProfileId}">${s.studentName} (${s.enrollmentNo})</option>`; });
      $('#studentDropdown').html(opts);
    },
    error: () => { $('#studentDropdown').html(`<option value="">— Error loading —</option>`); }
  });
}

function loadResult() {
  const id = $('#studentDropdown').val();
  if (!id) { showAlert('Student select karo.', 'error'); return; }
  $('#spinner').show(); $('#resultArea').hide();
  $.ajax({
    url: API_BASE + '/Result/student/' + id, headers: authHeader(),
    success: d => { $('#spinner').hide(); renderResult(d, $('#studentDropdown option:selected').text()); },
    error:   x => { $('#spinner').hide(); showAlert(x.responseJSON?.message || 'Error.', 'error'); }
  });
}

function renderResult(data, label) {
  const cgpa = data.cgpa ?? 0;
  const semCount = data.semesters?.length || 0;
  const cgpaColor = cgpa >= 7 ? 'badge-success' : cgpa >= 5 ? 'badge-warning' : 'badge-danger';

  // CGPA Hero
  $('#cgpaBanner').html(`
    <div class="cgpa-circle">
      <div class="cgpa-val">${cgpa.toFixed(2)}</div>
      <div class="cgpa-sub">CGPA</div>
    </div>
    <div class="cgpa-info">
      <div class="cgpa-name">${label}</div>
      <div class="cgpa-chips">
        <span class="glass-badge badge-info">📊 ${semCount} Semester${semCount !== 1 ? 's' : ''}</span>
        <span class="glass-badge ${cgpaColor}">CGPA: ${cgpa.toFixed(2)}</span>
      </div>
    </div>`);

  // SPI chips
  let spiHtml = '';
  (data.semesters || []).forEach(sem => {
    const badgeCls = sem.status?.includes('Fail') ? 'badge-danger' : 'badge-success';
    spiHtml += `
    <div class="spi-card" onclick="jumpToSem(${sem.semester})">
      <div class="spi-sem">Semester ${sem.semester}</div>
      <div class="spi-val">${sem.spi}</div>
      <div class="spi-badge"><span class="glass-badge ${badgeCls}" style="font-size:10px">${sem.status}</span></div>
    </div>`;
  });
  $('#spiRow').html(spiHtml || '<div class="td-muted" style="padding:16px">No semesters yet</div>');

  // Semester accordion
  let semHtml = '';
  (data.semesters || []).forEach(sem => {
    const passClass = sem.status?.includes('Fail') ? 'badge-danger' : 'badge-success';
    let rows = '';
    (sem.subjects || []).forEach(s => {
      rows += `<tr>
        <td class="td-bold">${s.courseName}</td>
        <td><span class="td-code">${s.courseCode}</span></td>
        <td>${s.credits} cr</td>
        <td>${s.totalInternal}</td>
        <td>${s.externalScore}</td>
        <td class="td-bold">${s.total}</td>
        <td>${gradePill(s.grade)}</td>
        <td>${s.gradePoint}</td>
        <td><span class="glass-badge ${s.isPassing ? 'badge-success' : 'badge-danger'}">${s.status}</span></td>
      </tr>`;
    });

    semHtml += `
    <div class="sem-block" id="semBlock${sem.semester}">
      <div class="sem-header collapsed" onclick="toggleSem(${sem.semester}, this)">
        <span class="sem-htitle">📚 Semester ${sem.semester}</span>
        <div class="sem-hright">
          <span class="sem-spi">SPI: ${sem.spi}</span>
          <span class="glass-badge ${passClass}" style="font-size:11px">${sem.status}</span>
          <span class="chevron">▾</span>
        </div>
      </div>
      <div class="sem-body" id="semBody${sem.semester}">
        <div class="glass-table-wrap" style="border-radius:0;border:none;">
          <table class="glass-table">
            <thead><tr>
              <th>Course</th><th>Code</th><th>Credits</th>
              <th>Internal /40</th><th>External /60</th><th>Total /100</th>
              <th>Grade</th><th>GP</th><th>Status</th>
            </tr></thead>
            <tbody>${rows || `<tr><td colspan="9">${emptyStateHtml('📭','No subject data','')}</td></tr>`}</tbody>
          </table>
        </div>
      </div>
    </div>`;
  });

  if (!semHtml) semHtml = emptyStateHtml('📭','No result data found','No marks have been entered yet.');
  $('#semContainer').html(semHtml);
  $('#resultArea').fadeIn(300);
}

function toggleSem(semNum, headerEl) {
  const body = $('#semBody' + semNum);
  const chev = $(headerEl).find('.chevron');
  body.toggleClass('open');
  chev.toggleClass('open');
  $(headerEl).toggleClass('collapsed', !body.hasClass('open'));
}

function jumpToSem(semNum) {
  const body   = $('#semBody' + semNum);
  const header = body.prev('.sem-header');
  if (!body.hasClass('open')) {
    body.addClass('open');
    header.find('.chevron').addClass('open');
    header.removeClass('collapsed');
  }
  $('html, body').animate({ scrollTop: $('#semBlock' + semNum).offset().top - 100 }, 400);
}
</script>
</body>
</html>
