<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Departments — Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
  *{box-sizing:border-box;}
  body{font-family:'Outfit',sans-serif;background:#0f1117;color:#e5e7eb;margin:0;}
  .sidebar{width:240px;min-height:100vh;background:#161b27;border-right:1px solid rgba(255,255,255,.06);position:fixed;top:0;left:0;padding:24px 16px;display:flex;flex-direction:column;}
  .sidebar-brand{display:flex;align-items:center;gap:10px;padding:0 8px;margin-bottom:32px;}
  .sidebar-brand .icon{width:38px;height:38px;background:linear-gradient(135deg,#6366f1,#10b981);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .sidebar-brand span{font-size:16px;font-weight:700;color:#fff;}
  .nav-section{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;padding:0 8px;margin:16px 0 8px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#9ca3af;text-decoration:none;font-size:14px;font-weight:500;transition:.2s;margin-bottom:2px;}
  .nav-item:hover,.nav-item.active{background:rgba(99,102,241,.15);color:#a5b4fc;}
  .nav-item.active{border-left:3px solid #6366f1;}
  .sidebar-bottom{margin-top:auto;}
  .btn-logout{width:100%;padding:10px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#fca5a5;border-radius:10px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;}
  .btn-logout:hover{background:rgba(239,68,68,.2);}
  .main{margin-left:240px;padding:28px 32px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
  .topbar h2{font-size:22px;font-weight:700;color:#fff;}
  .btn-add{background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;color:#fff;border-radius:10px;padding:10px 20px;font-family:'Outfit',sans-serif;font-weight:600;font-size:14px;cursor:pointer;transition:.2s;}
  .btn-add:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,.4);}
  .table-card{background:#1a1f2e;border:1px solid rgba(255,255,255,.06);border-radius:14px;overflow:hidden;}
  .table-header{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center;}
  .table-header span{font-weight:600;color:#fff;font-size:15px;}
  .count-badge{background:rgba(99,102,241,.2);color:#a5b4fc;padding:3px 10px;border-radius:20px;font-size:12px;}
  table{width:100%;border-collapse:collapse;}
  thead th{background:#111827;padding:12px 16px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#6b7280;font-weight:600;border-bottom:1px solid rgba(255,255,255,.06);}
  tbody td{padding:14px 16px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.04);color:#d1d5db;}
  tbody tr:hover{background:rgba(255,255,255,.02);}
  .btn-edit{background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.3);color:#a5b4fc;border-radius:7px;padding:5px 14px;font-size:13px;cursor:pointer;font-family:'Outfit',sans-serif;}
  .btn-edit:hover{background:rgba(99,102,241,.3);}
  .btn-del{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#fca5a5;border-radius:7px;padding:5px 14px;font-size:13px;cursor:pointer;font-family:'Outfit',sans-serif;margin-left:6px;}
  .btn-del:hover{background:rgba(239,68,68,.25);}
  .modal-content{background:#1a1f2e;border:1px solid rgba(255,255,255,.08);border-radius:16px;color:#e5e7eb;}
  .modal-header{border-bottom:1px solid rgba(255,255,255,.06);padding:18px 24px;}
  .modal-title{font-weight:700;color:#fff;}
  .modal-footer{border-top:1px solid rgba(255,255,255,.06);}
  .btn-close{filter:invert(1);}
  .form-label{color:#9ca3af;font-size:13px;margin-bottom:5px;display:block;}
  .form-control{background:#111827;border:1px solid rgba(255,255,255,.1);color:#e5e7eb;border-radius:8px;padding:10px 14px;font-size:14px;font-family:'Outfit',sans-serif;width:100%;}
  .form-control:focus{background:#1f2937;border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15);color:#fff;outline:none;}
  .btn-save{background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;color:#fff;border-radius:8px;padding:9px 22px;font-family:'Outfit',sans-serif;font-weight:600;cursor:pointer;}
  .btn-cancel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#9ca3af;border-radius:8px;padding:9px 22px;font-family:'Outfit',sans-serif;cursor:pointer;}
  .toast-box{position:fixed;top:20px;right:20px;z-index:9999;background:#1a1f2e;border:1px solid rgba(16,185,129,.3);color:#6ee7b7;padding:12px 18px;border-radius:10px;font-size:14px;display:none;}
  .empty-row td{text-align:center;color:#4b5563;padding:40px!important;}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-brand">
    <div class="icon">🎓</div>
    <span>Admin Panel</span>
  </div>
  <div class="nav-section">Main</div>
  <a href="admin.html" class="nav-item"><span>📊</span> Dashboard</a>
  <a href="users.html" class="nav-item"><span>👥</span> Users</a>
  <div class="nav-section">Management</div>
  <a href="departments.html" class="nav-item active"><span>🏛️</span> Departments</a>
  <a href="courses.html" class="nav-item"><span>📚</span> Courses</a>
  <a href="students.html" class="nav-item"><span>🎓</span> Students</a>
  <a href="Exam.html" class="nav-item"><span>📝</span> Exams</a>
  <a href="StudyMaterial.html" class="nav-item"><span>📖</span> Study Material</a>
  <div class="sidebar-bottom">
    <button class="btn-logout" onclick="logout()">🚪 Logout</button>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <h2>Departments</h2>
    <button class="btn-add" onclick="openAdd()">+ Add Department</button>
  </div>

  <div class="table-card">
    <div class="table-header">
      <span>All Departments</span>
      <span class="count-badge" id="countBadge">0 records</span>
    </div>
    <table>
      <thead>
        <tr><th>#</th><th>Department Name</th><th>Courses</th><th>Actions</th></tr>
      </thead>
      <tbody id="deptTable"></tbody>
    </table>
  </div>
</div>

<!-- Add Modal -->
<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Department</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <label class="form-label">Department Name</label>
        <input type="text" id="addName" class="form-control" placeholder="e.g. Computer Science">
      </div>
      <div class="modal-footer p-3">
        <button class="btn-cancel" data-bs-dismiss="modal">Cancel</button>
        <button class="btn-save" onclick="addDepartment()">Add</button>
      </div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Department</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <input type="hidden" id="editId">
        <label class="form-label">Department Name</label>
        <input type="text" id="editName" class="form-control">
      </div>
      <div class="modal-footer p-3">
        <button class="btn-cancel" data-bs-dismiss="modal">Cancel</button>
        <button class="btn-save" onclick="updateDepartment()">Save Changes</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-box" id="toastBox"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const token = localStorage.getItem("token");
const role = localStorage.getItem("role");
if(!token || role !== "Admin") location.href = "login.html";

const BASE = "https://localhost:7142/api/Admin";

function toast(msg, ok=true) {
  $("#toastBox").css("border-color", ok ? "rgba(16,185,129,.3)" : "rgba(239,68,68,.3)")
    .css("color", ok ? "#6ee7b7" : "#fca5a5").text(msg).fadeIn(200);
  setTimeout(()=>$("#toastBox").fadeOut(300), 2500);
}

function loadDepts() {
  $.ajax({
    url: BASE+"/departments", type:"GET",
    headers:{Authorization:"Bearer "+token},
    success:function(data){
      $("#countBadge").text(data.length+" records");
      let rows = "";
      $.each(data, function(i,d){
        rows += `<tr>
          <td>${d.departmentId}</td>
          <td style="font-weight:600;color:#fff">${d.departmentName}</td>
          <td><span style="color:#6b7280;font-size:13px">${d.courseCount ?? 0} courses</span></td>
          <td>
            <button class="btn-edit" onclick="openEdit(${d.departmentId},'${d.departmentName}')">Edit</button>
            <button class="btn-del" onclick="deleteDept(${d.departmentId})">Delete</button>
          </td>
        </tr>`;
      });
      $("#deptTable").html(rows || '<tr class="empty-row"><td colspan="4">No departments found</td></tr>');
    },
    error:function(){ toast("Failed to load departments", false); }
  });
}

function openAdd() {
  $("#addName").val("");
  new bootstrap.Modal(document.getElementById("addModal")).show();
}

function addDepartment() {
  let name = $("#addName").val().trim();
  if(!name){ toast("Enter department name", false); return; }
  $.ajax({
    url: BASE+"/departments", type:"POST",
    contentType:"application/json", headers:{Authorization:"Bearer "+token},
    data: JSON.stringify({departmentName: name}),
    success:function(){
      bootstrap.Modal.getInstance(document.getElementById("addModal")).hide();
      toast("✅ Department added!"); loadDepts();
    },
    error:function(xhr){ toast(xhr.responseText || "Failed", false); }
  });
}

function openEdit(id, name) {
  $("#editId").val(id); $("#editName").val(name);
  new bootstrap.Modal(document.getElementById("editModal")).show();
}

function updateDepartment() {
  let id = $("#editId").val();
  let name = $("#editName").val().trim();
  if(!name){ toast("Enter department name", false); return; }
  $.ajax({
    url: BASE+"/departments/"+id, type:"PUT",
    contentType:"application/json", headers:{Authorization:"Bearer "+token},
    data: JSON.stringify({departmentName: name}),
    success:function(){
      bootstrap.Modal.getInstance(document.getElementById("editModal")).hide();
      toast("✅ Department updated!"); loadDepts();
    },
    error:function(xhr){ toast(xhr.responseText || "Failed", false); }
  });
}

function deleteDept(id) {
  if(!confirm("Delete this department?")) return;
  $.ajax({
    url: BASE+"/departments/"+id, type:"DELETE",
    headers:{Authorization:"Bearer "+token},
    success:function(){ toast("🗑️ Department deleted!"); loadDepts(); },
    error:function(xhr){ toast(xhr.responseText || "Failed", false); }
  });
}

function logout(){ localStorage.clear(); location.href="login.html"; }

loadDepts();
</script>
</body>
</html>
