<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0f1117;
            color: #e5e7eb;
            margin: 0;
        }

        .sidebar {
            width: 240px;
            min-height: 100vh;
            background: #161b27;
            border-right: 1px solid rgba(255, 255, 255, .06);
            position: fixed;
            top: 0;
            left: 0;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 8px;
            margin-bottom: 32px;
        }

        .sidebar-brand .icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #6366f1, #10b981);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .sidebar-brand span {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .nav-section {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: #4b5563;
            padding: 0 8px;
            margin: 16px 0 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: .2s;
            margin-bottom: 2px;
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(99, 102, 241, .15);
            color: #a5b4fc;
        }

        .nav-item.active {
            border-left: 3px solid #6366f1;
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        .btn-logout {
            width: 100%;
            padding: 10px;
            background: rgba(239, 68, 68, .1);
            border: 1px solid rgba(239, 68, 68, .2);
            color: #fca5a5;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, .2);
        }

        .main {
            margin-left: 240px;
            padding: 28px 32px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .topbar h2 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }

        .filter-card {
            background: #1a1f2e;
            border: 1px solid rgba(255, 255, 255, .06);
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 20px;
        }

        .form-control,
        .form-select {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, .1);
            color: #e5e7eb;
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 14px;
            font-family: 'Outfit', sans-serif;
        }

        .form-control:focus,
        .form-select:focus {
            background: #1f2937;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, .15);
            color: #fff;
            outline: none;
        }

        .form-select option {
            background: #1f2937;
            color: #e5e7eb;
        }

        .table-card {
            background: #1a1f2e;
            border: 1px solid rgba(255, 255, 255, .06);
            border-radius: 14px;
            overflow: hidden;
        }

        .table-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, .06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-header span {
            font-weight: 600;
            color: #fff;
            font-size: 15px;
        }

        .table-header .count {
            background: rgba(99, 102, 241, .2);
            color: #a5b4fc;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: #111827;
            padding: 12px 16px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: #6b7280;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, .06);
        }

        tbody td {
            padding: 13px 16px;
            font-size: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, .04);
            color: #d1d5db;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, .02);
        }

        .badge-active {
            background: rgba(16, 185, 129, .15);
            color: #6ee7b7;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-inactive {
            background: rgba(239, 68, 68, .15);
            color: #fca5a5;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-role {
            background: rgba(99, 102, 241, .15);
            color: #a5b4fc;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-staff {
            background: rgba(245, 158, 11, .15);
            color: #fcd34d;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-admin {
            background: rgba(236, 72, 153, .15);
            color: #f9a8d4;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .btn-edit {
            background: rgba(99, 102, 241, .15);
            border: 1px solid rgba(99, 102, 241, .3);
            color: #a5b4fc;
            border-radius: 7px;
            padding: 5px 12px;
            font-size: 13px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
        }

        .btn-edit:hover {
            background: rgba(99, 102, 241, .3);
        }

        .btn-del {
            background: rgba(239, 68, 68, .1);
            border: 1px solid rgba(239, 68, 68, .2);
            color: #fca5a5;
            border-radius: 7px;
            padding: 5px 12px;
            font-size: 13px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            margin-left: 5px;
        }

        .btn-del:hover {
            background: rgba(239, 68, 68, .25);
        }

        /* Modal */
        .modal-content {
            background: #1a1f2e;
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 16px;
            color: #e5e7eb;
        }

        .modal-header {
            border-bottom: 1px solid rgba(255, 255, 255, .06);
            padding: 18px 24px;
        }

        .modal-title {
            font-weight: 700;
            color: #fff;
        }

        .modal-footer {
            border-top: 1px solid rgba(255, 255, 255, .06);
        }

        .btn-close {
            filter: invert(1);
        }

        .form-label {
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .btn-save {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            color: #fff;
            border-radius: 8px;
            padding: 9px 22px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .1);
            color: #9ca3af;
            border-radius: 8px;
            padding: 9px 22px;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
        }

        .toast-box {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            min-width: 260px;
            background: #1a1f2e;
            border: 1px solid rgba(16, 185, 129, .3);
            color: #6ee7b7;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            animation: fadeIn .3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-brand">
            <div class="icon">🎓</div>
            <span>Admin Panel</span>
        </div>
        <div class="nav-section">Main</div>
        <a href="admin.html" class="nav-item"><span>📊</span> Dashboard</a>
        <a href="users.html" class="nav-item active"><span>👥</span> Users</a>
        <div class="nav-section">Management</div>
        <a href="departments.html" class="nav-item"><span>🏛️</span> Departments</a>
        <a href="courses.html" class="nav-item"><span>📚</span> Courses</a>
        <a href="students.html" class="nav-item"><span>🎓</span> Students</a>
        <a href="Exam.html" class="nav-item"><span>📝</span> Exams</a>
        <a href="StudyMaterial.html" class="nav-item"><span>📖</span> Study Material</a>
        <div class="sidebar-bottom">
            <button class="btn-logout" onclick="logout()">🚪 Logout</button>
        </div>
    </div>

    <div class="main">
        <div class="topbar">
            <h2>Users Management</h2>
        </div>

        <div class="filter-card">
            <div class="row g-2">
                <div class="col-md-4"><input type="text" id="searchBox" class="form-control"
                        placeholder="🔍 Search by name..."></div>
                <div class="col-md-4">
                    <select id="roleFilter" class="form-select">
                        <option value="">All Roles</option>
                        <option value="Student">Student</option>
                        <option value="Faculty">Faculty</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <select id="statusFilter" class="form-select">
                        <option value="">All Status</option>
                        <option value="true">Active</option>
                        <option value="false">Inactive</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="table-card">
            <div class="table-header">
                <span>All Users</span>
                <span class="count" id="countBadge">0 records</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTable"></tbody>
            </table>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" id="editId">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="editName" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="editEmail" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select id="editRole" class="form-select">
                            <option value="Student">Student</option>
                            <option value="Faculty">Faculty</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select id="editStatus" class="form-select">
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn-cancel" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn-save" onclick="updateUser()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-box" id="toastBox"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem("token");
        const role = localStorage.getItem("role");
        if (!token || role !== "Admin") location.href = "login.html";

        function toast(msg) { $("#toastBox").text(msg).fadeIn(200); setTimeout(() => $("#toastBox").fadeOut(300), 2500); }

        loadUsers();
        $("#searchBox").on("keyup", loadUsers);
        $("#roleFilter,#statusFilter").on("change", loadUsers);

        function getRoleBadge(r) {
            if (r === "Student") return `<span class="badge-role">Student</span>`;
            if (r === "Faculty") return `<span class="badge-staff">Faculty</span>`;
            if (r === "Admin") return `<span class="badge-admin">Admin</span>`;
            return r;
        }

        function loadUsers() {
            $.ajax({
                url: "https://localhost:7142/api/Admin/users", type: "GET",
                headers: { Authorization: "Bearer " + token },
                success: function (users) {
                    let s = $("#searchBox").val().toLowerCase();
                    let rf = $("#roleFilter").val();
                    let sf = $("#statusFilter").val();
                    let filtered = users.filter(u =>
                        (!s || u.name.toLowerCase().includes(s)) &&
                        (!rf || u.roleName === rf) &&
                        (!sf || u.status.toString() === sf)
                    );
                    $("#countBadge").text(filtered.length + " records");
                    let rows = "";
                    $.each(filtered, function (i, u) {
                        rows += `<tr>
          <td>${u.userId}</td>
          <td style="font-weight:600;color:#fff">${u.name}</td>
          <td style="color:#9ca3af">${u.email}</td>
          <td>${getRoleBadge(u.roleName)}</td>
          <td>${u.status ? '<span class="badge-active">Active</span>' : '<span class="badge-inactive">Inactive</span>'}</td>
          <td>
            <button class="btn-edit" onclick="openEdit(${u.userId},'${u.name}','${u.email}','${u.roleName}',${u.status})">Edit</button>
            <button class="btn-del" onclick="deleteUser(${u.userId})">Delete</button>
          </td>
        </tr>`;
                    });
                    $("#userTable").html(rows || '<tr><td colspan="6" style="text-align:center;color:#6b7280;padding:30px">No users found</td></tr>');
                }
            });
        }

        function openEdit(id, name, email, role, status) {
            $("#editId").val(id); $("#editName").val(name);
            $("#editEmail").val(email); $("#editRole").val(role);
            $("#editStatus").val(status.toString());
            new bootstrap.Modal(document.getElementById("editModal")).show();
        }

        function updateUser() {
            let id = $("#editId").val();
            let data = { name: $("#editName").val(), email: $("#editEmail").val(), roleName: $("#editRole").val(), status: $("#editStatus").val() === "true" };
            $.ajax({
                url: `https://localhost:7142/api/Admin/update-user/${id}`, type: "PUT",
                contentType: "application/json", headers: { Authorization: "Bearer " + token },
                data: JSON.stringify(data),
                success: function () { bootstrap.Modal.getInstance(document.getElementById("editModal")).hide(); toast("✅ User updated!"); loadUsers(); }
            });
        }

        function deleteUser(id) {
            if (!confirm("Delete this user?")) return;
            $.ajax({
                url: `https://localhost:7142/api/Admin/delete-user/${id}`, type: "DELETE",
                headers: { Authorization: "Bearer " + token },
                success: function () { toast("🗑️ User deleted!"); loadUsers(); }
            });
        }

        function logout() { localStorage.clear(); location.href = "login.html"; }
    </script>
</body>

</html>
